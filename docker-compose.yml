version: '3'

services:
  # Using MongoDB Atlas instead of local MongoDB
  # No need for a MongoDB container anymore
  
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      # MongoDB Atlas connection - replace <db_password> with your actual password
      - MONGODB_URI=mongodb+srv://kartikeylodhe:<db_password>@cluster0.hudluyw.mongodb.net/query_mitra?retryWrites=true&w=majority
      - DATABASE_NAME=query_mitra
      - UPLOAD_FOLDER=uploads
    volumes:
      - ./Backend:/app
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    depends_on:
      - backend

# No volumes needed as we're using MongoDB Atlas
